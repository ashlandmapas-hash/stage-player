<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Stage Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
      background-color: #000;
    }
    html, body, #twitch-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="twitch-container"></div>

  <!-- Handler para evitar que SendDuiMessage do FiveM quebre o CEF -->
  <script>
    window.addEventListener('message', function(event) {
      // Ignora mensagens do FiveM com segurança sem disparar unhandled exceptions
    });
  </script>

  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const channel = params.get('canal') || 'gaules';
    const currentDomain = window.location.hostname;

    let player;
    try {
      player = new Twitch.Player("twitch-container", {
        width: "100%",
        height: "100%",
        channel: channel,
        parent: [currentDomain],
        autoplay: true,
        muted: true, // Obrigatório true no início para não violar autoplay policy
        controls: false // Remove interface pesada que sobrecarrega o renderer do CEF
      });

      player.addEventListener(Twitch.Player.READY, function() {
        player.play();
        setTimeout(function() {
          player.setMuted(false);
          player.setVolume(1.0);
        }, 2000);
      });
    } catch (e) {
      console.error(e);
    }
  </script>
</body>
</html>
