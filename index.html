<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Twitch Stage Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
      background-color: #000;
    }
    html, body, #twitch-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="twitch-container"></div>

  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const channel = params.get('canal') || 'gaules';
    const currentDomain = window.location.hostname;

    // Configuração com autoplay destravado
    const player = new Twitch.Player("twitch-container", {
      width: "100%",
      height: "100%",
      channel: channel,
      parent: [currentDomain],
      autoplay: true,
      muted: true // OBRIGATÓRIO: Sem isso, o CEF do FiveM bloqueia a reprodução e deixa a tela preta
    });

    // Força o play assim que estiver pronto e desmuta suavemente
    player.addEventListener(Twitch.Player.READY, function() {
      player.play();
      setTimeout(() => {
        player.setMuted(false);
        player.setVolume(1.0);
      }, 1500);
    });

    // Se o player pausar por conta de anúncio, força retomar
    player.addEventListener(Twitch.Player.PAUSE, function() {
      player.play();
    });
  </script>
</body>
</html>
